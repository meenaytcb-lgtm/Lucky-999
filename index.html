<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai 777 Starter — Admin</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101114;color:#f5f5f5}
header{padding:20px;background:#1b1d22;border-bottom:1px solid #383838}main{max-width:1000px;margin:auto;padding:20px}
input,button,textarea{padding:11px;border-radius:8px;border:1px solid #555;background:#202228;color:white;margin:4px}
button{cursor:pointer;background:#9b762c;border:0;font-weight:700}.card{background:#1b1d22;border:1px solid #383838;border-radius:12px;padding:14px;margin:12px 0}
.small{color:#b7b7b7;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}
</style>
</head>
<body>
<header><h2>Dubai 777 — Admin Starter</h2><div class="small">Wallet request review only. No real money movement.</div></header>
<main>
  <section id="login" class="card">
    <h3>Admin sign in</h3>
    <input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Sign in</button><p id="loginMsg" class="small"></p>
  </section>
  <section id="panel" class="hidden">
    <div class="row"><h3 style="flex:1">Wallet Requests</h3><button id="refreshBtn">Refresh</button><button id="logoutBtn">Sign out</button></div>
    <p id="status" class="small"></p><div id="requests"></div>
  </section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, getIdTokenResult } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-functions.js";

// Replace these placeholders with your own Firebase Web App config.
const firebaseConfig = {
  apiKey: "REPLACE_ME",
  authDomain: "REPLACE_ME.firebaseapp.com",
  projectId: "REPLACE_ME",
  appId: "REPLACE_ME"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), functions = getFunctions(app);
const $ = id => document.getElementById(id);
$('loginBtn').onclick = async () => {
  $('loginMsg').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
  catch(e) { $('loginMsg').textContent = e.message; }
};
$('logoutBtn').onclick = () => signOut(auth);
$('refreshBtn').onclick = loadRequests;

onAuthStateChanged(auth, async user => {
  if (!user) { $('login').classList.remove('hidden'); $('panel').classList.add('hidden'); return; }
  try {
    const token = await getIdTokenResult(user, true);
    if (token.claims.admin !== true) throw new Error('This account does not have the admin custom claim.');
    $('login').classList.add('hidden'); $('panel').classList.remove('hidden'); await loadRequests();
  } catch(e) { $('login').classList.remove('hidden'); $('panel').classList.add('hidden'); $('loginMsg').textContent = e.message; }
});

async function loadRequests() {
  $('status').textContent = 'Loading…'; $('requests').innerHTML = '';
  try {
    const q = query(collection(db, 'walletRequests'), orderBy('createdAt', 'desc'), limit(100));
    const snap = await getDocs(q);
    if (snap.empty) $('requests').textContent = 'No requests found.';
    snap.forEach(doc => {
      const x = doc.data(), card = document.createElement('div'); card.className = 'card';
      const title = document.createElement('h3'); title.textContent = `${x.type} — ${x.amount} — ${x.status}`;
      const detail = document.createElement('p'); detail.className = 'small'; detail.textContent = `UID: ${x.uid} | Request: ${doc.id}`;
      const note = document.createElement('input'); note.placeholder = 'Review note (optional)'; note.maxLength = 500; note.style.width = 'min(400px,90%)';
      card.append(title, detail, note);
      if (x.status === 'pending') {
        for (const decision of ['approved','rejected']) {
          const btn = document.createElement('button'); btn.textContent = decision;
          btn.onclick = async () => {
            btn.disabled = true;
            try {
              await httpsCallable(functions, 'reviewWalletRequest')({requestId: doc.id, decision, note: note.value});
              await loadRequests();
            } catch(e) { alert(e.message); btn.disabled = false; }
          };
          card.append(btn);
        }
      }
      $('requests').append(card);
    });
    $('status').textContent = `Loaded ${snap.size} request(s).`;
  } catch(e) { $('status').textContent = e.message; }
}
</script>
</body></html>
